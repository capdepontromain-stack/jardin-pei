  <!-- lagon bleu -->
  <path d="M60 330 Q130 300 200 330 T340 330 T460 330 L460 360 Q390 390 320 360 T180 360 T60 360 Z" fill="#19A7D6" opacity="0.9"/>
  <!-- feuilles -->
  <path d="M258 420 C180 400 120 340 125 250 C215 255 270 320 258 420 Z" fill="url(#leafA)"/>
  <path d="M258 420 C190 395 150 330 160 265" fill="none" stroke="#FFF7E6" stroke-width="7" stroke-linecap="round"/>
