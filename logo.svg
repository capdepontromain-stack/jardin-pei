    <line x1="150" y1="100" x2="168" y2="118"/>
    <line x1="370" y1="100" x2="352" y2="118"/>
    <line x1="105" y1="200" x2="130" y2="205"/>
    <line x1="415" y1="200" x2="390" y2="205"/>
